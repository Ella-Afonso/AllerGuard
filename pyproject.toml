[project]
name = "allerguard"
version = "0.1.0"
description = "Background recall monitoring and decision support for small UK food businesses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "boto3[crt]",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
